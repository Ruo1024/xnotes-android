name: Android tests (no release)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android components
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/android-sdk"
          mkdir -p "$sdk/cmdline-tools"
          curl --fail --location --retry 3 \
            https://dl.google.com/android/repository/commandlinetools-linux-15641748_latest.zip \
            -o "$RUNNER_TEMP/android-tools.zip"
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$sdk/cmdline-tools/latest"
          manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$manager" --sdk_root="$sdk" --licenses > /dev/null
          set -o pipefail
          "$manager" --sdk_root="$sdk" 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk" "$sdk" >> "$GITHUB_ENV"
      - name: Test Release
        run: ./gradlew testReleaseUnitTest --no-daemon --console=plain
      - name: Build unsigned Release
        run: ./gradlew assembleRelease --no-daemon --console=plain
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/testReleaseUnitTest
            app/build/test-results/testReleaseUnitTest
