// Only used by this fork's release workflow. Keep the existing Chinese APK's application ID.
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        project.extensions.getByName('androidComponents').finalizeDsl { android ->
            android.defaultConfig.applicationId = 'com.xnotes.debug'
            // Fork build number: increases even when replacing the same release tag.
            android.defaultConfig.versionCode = 55
            android.defaultConfig.versionName = System.getenv('RELEASE_TAG').substring(1)
        }
    }
}
